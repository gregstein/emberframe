# xim-ctext 0.5.0 by Riey (MIT, https://github.com/Riey/xim-rs), published here as 0.3.1.
#
# GPUI 0.2.2 is tied to xim-ctext 0.3, whose decoder only understands UTF-8 and
# makes the application panic when an X input method commits "Ç" or "ş" in
# ISO 8859-1 or ISO 8859-9. Version 0.5.0 decodes those and has the same
# interface, so it is used in place of 0.3 through [patch.crates-io].
# Drop this folder once GPUI depends on xim-ctext 0.5 or later.
[package]
name = "xim-ctext"
version = "0.3.1"
edition = "2021"
authors = ["Riey <creeper844@gmail.com>"]
description = "compound text en/decoder"
license = "MIT"
repository = "https://github.com/Riey/xim-rs"

[features]
default = ["std"]
std = []

[dependencies]
encoding_rs = "0.8.28"
