[package]
name = "emberframe"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "A screen-design editor with a classic docked-panel workspace, built on GPUI."
license = "MIT"
authors = ["Med Amine Belbachir <https://medamineweb.com>"]
repository = "https://github.com/gregstein/emberframe"
homepage = "https://medamineweb.com/en/emberframe/"
readme = "README.md"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
tiny-skia = "0.11"
ab_glyph = "0.2"
anyhow = "1"
i_overlay = "9.1.0"
png = "0.18"
gif = "0.14"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
strip = true
